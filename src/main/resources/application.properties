spring.application.name=catalogo
server.port=${CATALOGO_PORT:8081}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${CATALOGO_DB_NAME}
spring.datasource.username=${CATALOGO_DB_USER}
spring.datasource.password=${CATALOGO_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
