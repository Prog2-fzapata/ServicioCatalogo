spring.application.name=catalogo
server.port=${CATALOGO_PORT:8081}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${CATALOGO_DB_NAME}
spring.datasource.username=${CATALOGO_DB_USER}
spring.datasource.password=${CATALOGO_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

# JWT: clave en Base64 (mínimo 512 bits) y vigencias por defecto de JHipster
jwt.secret=${JWT_SECRET}
jwt.token-validity=24h
jwt.remember-me-validity=30d

# Cátedra: URL base y JWT técnico por entorno (obligatorios); timeouts por defecto, configurables
catedra.base-url=${CATEDRA_BASE_URL}
catedra.jwt=${CATEDRA_JWT}
catedra.connect-timeout=3s
catedra.read-timeout=10s

# Redis de la cátedra (solo lectura): host, puerto y credenciales por entorno (obligatorios); timeouts configurables.
# El host es la IP de ZeroTier, no el que devuelve "integration" (interno)
spring.data.redis.host=${CATEDRA_REDIS_HOST}
spring.data.redis.port=${CATEDRA_REDIS_PORT}
spring.data.redis.username=${CATEDRA_REDIS_USERNAME}
spring.data.redis.password=${CATEDRA_REDIS_PASSWORD}
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=10s
# No se usan repositorios de Redis: sin esto Spring Data los busca entre los repositorios JPA
spring.data.redis.repositories.enabled=false
# Un Redis ajeno caído no debe volver "no saludable" al servicio, que sigue sirviendo el catálogo local
management.health.redis.enabled=false

# Kafka de la cátedra (consume CatalogUpdated): servidores y grupo por entorno (obligatorios). El servidor es la IP de
# ZeroTier y el broker no pide autenticación. El offset se confirma a mano, después de guardar en la base
spring.kafka.bootstrap-servers=${CATEDRA_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=${CATEDRA_KAFKA_GROUP_ID}
spring.kafka.consumer.enable-auto-commit=false
# Un grupo nuevo empieza por el principio: los eventos viejos se descartan solos (copia ya al día o eventId repetido)
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=manual
# Reintentos ante un fallo al procesar un evento y verificación periódica de versión: parámetros de ajuste con valor
# por defecto. Si la variable de entorno está definida, gana (en Docker se pasa desde el shell o el .env, ver compose)
catedra.kafka.max-retries=${CATEDRA_KAFKA_MAX_RETRIES:3}
catedra.kafka.initial-backoff=${CATEDRA_KAFKA_INITIAL_BACKOFF:1s}
catedra.sync.check-interval=${CATEDRA_SYNC_CHECK_INTERVAL:5m}
catedra.sync.initial-delay=${CATEDRA_SYNC_INITIAL_DELAY:10s}

# Búsquedas paginadas: tamaño máximo de página (un size mayor se reduce a este valor); el tamaño por defecto es 20
spring.data.web.pageable.max-page-size=${CATALOGO_PAGE_MAX_SIZE:100}

# Nombres del contrato de la cátedra (ruta del snapshot y claves de Redis): salen del .env, sin valor por defecto.
# Si la cátedra cambia uno, se cambia allí y se reinicia el servicio
catedra.contract.snapshot-path=${CATEDRA_SNAPSHOT_PATH}
catedra.contract.redis-keys.metadata=${CATEDRA_REDIS_KEY_METADATA}
catedra.contract.redis-keys.changes-prefix=${CATEDRA_REDIS_KEY_CHANGES_PREFIX}
catedra.contract.redis-keys.categories=${CATEDRA_REDIS_KEY_CATEGORIES}
catedra.contract.redis-keys.professionals=${CATEDRA_REDIS_KEY_PROFESSIONALS}
catedra.contract.redis-keys.weekly-schedules=${CATEDRA_REDIS_KEY_WEEKLY_SCHEDULES}
catedra.contract.kafka-catalog-topic=${CATEDRA_KAFKA_CATALOG_TOPIC}

# Hash de contraseñas (Argon2id): costo por entorno, sin valor por defecto. No puede bajar de los mínimos de OWASP
password.argon2.memory-kib=${PASSWORD_ARGON2_MEMORY_KIB}
password.argon2.iterations=${PASSWORD_ARGON2_ITERATIONS}
password.argon2.parallelism=${PASSWORD_ARGON2_PARALLELISM}
