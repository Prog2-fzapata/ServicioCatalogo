services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CATALOGO_DB_NAME}
      POSTGRES_USER: ${CATALOGO_DB_USER}
      POSTGRES_PASSWORD: ${CATALOGO_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalogo:
    build: .
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      CATALOGO_DB_NAME: ${CATALOGO_DB_NAME}
      CATALOGO_DB_USER: ${CATALOGO_DB_USER}
      CATALOGO_DB_PASSWORD: ${CATALOGO_DB_PASSWORD}
    ports:
      - "127.0.0.1:${CATALOGO_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
